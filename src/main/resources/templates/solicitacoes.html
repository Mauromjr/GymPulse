<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymPulse - Solicitações</title>
    <link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .page-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card-main {
            width: 100%;
            background-color: #121212;
            border: 1px solid #262626;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            box-sizing: border-box;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-icon-box {
            width: 40px;
            height: 40px;
            background-color: #212121;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #adff00;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .card-title {
            font-weight: 800;
            font-size: 1.05rem;
            color: #ffffff;
        }

        .card-subtitle {
            font-size: 0.78rem;
            color: #888888;
            margin-top: 2px;
        }

        .request-item {
            background-color: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .personal-detail {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .personal-avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background-color: #262626;
            border: 1.5px solid #adff00;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .actions-group {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .action-form {
            flex: 1;
            display: flex;
        }

        .btn-approve-new {
            width: 100%;
            height: 44px;
            background-color: #adff00;
            color: #000000;
            border: none;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 0 10px;
            box-sizing: border-box;
            white-space: nowrap;
        }

        .btn-reject-new {
            width: 100%;
            height: 44px;
            background-color: transparent;
            border: 1px solid #ff4d4d;
            color: #ff4d4d;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 0 10px;
            box-sizing: border-box;
            white-space: nowrap;
        }

        .btn-approve-new:hover {
            opacity: 0.9;
        }

        .btn-reject-new:hover {
            background-color: rgba(255, 77, 77, 0.1);
        }
    </style>
</head>
<body>

    <main class="app-screen" style="justify-content: flex-start;">
        
        <!-- pesinho para voltar pra Home -->
        <header class="top-header" style="position: relative;">
            <div class="profile-avatar">
                <i class="fa-regular fa-user"></i>
            </div>
            
            <a href="home.html" th:href="@{/home}" style="position: absolute; left: 50%; transform: translateX(-50%); text-decoration: none;">
                <i class="fa-solid fa-dumbbell" style="font-size: 1.8rem; color: #adff00;"></i>
            </a>
            
            <button class="icon-btn">
                <i class="fa-regular fa-bell"></i>
                <span class="badge">1</span>
            </button>
        </header>

        <div class="page-container">
            <section class="card-main">
                <div class="card-header">
                    <div class="card-icon-box">
                        <i class="fa-regular fa-clipboard"></i>
                    </div>
                    <div>
                        <div class="card-title">Solicitações Pendentes</div>
                        <div class="card-subtitle">Aprove ou recuse os pedidos recebidos</div>
                    </div>
                </div>

                <hr style="border: 0; border-top: 1px solid #262626;">

                <!-- card de solicitação -->
                <div class="request-item" th:each="solicitacao : ${solicitacoes}">
                    <div class="personal-detail">
                        <div class="personal-avatar">
                            <i class="fa-solid fa-user-tie"></i>
                        </div>
                        <div>
                            <div style="font-weight: 700; color: #fff; font-size: 1rem;" th:text="${solicitacao.nomePersonal}">Personal Mauro</div>
                            <div style="font-size: 0.8rem; color: #aaa; margin-top: 2px;" th:text="'ID: ' + ${solicitacao.idPersonal}">ID: 784035</div>
                        </div>
                    </div>

                    <div class="actions-group">
                        <form th:action="@{/solicitacoes/aprovar}" method="POST" class="action-form">
                            <input type="hidden" name="id" th:value="${solicitacao.id}">
                            <button type="submit" class="btn-approve-new">
                                <i class="fa-regular fa-circle-check"></i> Aprovar
                            </button>
                        </form>

                        <form th:action="@{/solicitacoes/recusar}" method="POST" class="action-form">
                            <input type="hidden" name="id" th:value="${solicitacao.id}">
                            <button type="submit" class="btn-reject-new">
                                <i class="fa-regular fa-circle-xmark"></i> Recusar
                            </button>
                        </form>
                    </div>
                </div>
            </section>
        </div>

    </main>

</body>
</html>
