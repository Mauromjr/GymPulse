<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymPulse - Solicitações do Personal</title>
    <link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .page-container { width: 100%; display: flex; flex-direction: column; gap: 16px; }
        
        .page-title {
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .notification-card {
            background-color: #121212;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-sizing: border-box;
        }

        .notif-header { display: flex; align-items: center; gap: 12px; }
        .notif-icon { 
            width: 40px; height: 40px; 
            border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 1.2rem; 
        }
        .icon-user { background-color: #1a1a1a; color: #aaa; border: 1px solid #adff00; }
        .icon-photo { background-color: #1a1a1a; color: #adff00; border: 1px solid #adff00; }
        
        .notif-text { display: flex; flex-direction: column; }
        .notif-name { color: #ffffff; font-weight: 800; font-size: 0.95rem; }
        .notif-desc { color: #aaaaaa; font-size: 0.8rem; }

        .action-buttons { display: flex; gap: 10px; width: 100%; }
        
        .btn-accept {
            flex: 1; height: 40px;
            background-color: #adff00; color: #000000;
            border: none; border-radius: 12px;
            font-weight: 800; font-size: 0.85rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            text-decoration: none;
        }
        .btn-reject {
            flex: 1; height: 40px;
            background-color: transparent; color: #ff4444;
            border: 1px solid #552222; border-radius: 12px;
            font-weight: 800; font-size: 0.85rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .btn-full {
            width: 100%; height: 40px;
            background-color: transparent; color: #adff00;
            border: 1px solid #adff00; border-radius: 12px;
            font-weight: 800; font-size: 0.85rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="app-screen" style="justify-content: flex-start;">
        
        <!-- Header -->
        <header class="top-header" style="position: relative;">
            <a href="personal_home.html" class="profile-avatar" style="text-decoration: none; color: inherit; background: transparent; border: none;">
                <i class="fa-solid fa-arrow-left" style="font-size: 1.2rem;"></i>
            </a>
            
            <div style="text-align: center; position: absolute; left: 50%; transform: translateX(-50%);">
                <i class="fa-solid fa-dumbbell" style="font-size: 1.5rem; color: #adff00;"></i>
                <div style="color: #adff00; font-size: 0.75rem; font-weight: 800; margin-top: 2px; text-transform: uppercase;">Personal</div>
                <div style="color: #ffffff; font-weight: 800; font-size: 0.9rem;">Luiz Felipe</div>
            </div>
            
            <div class="icon-btn" style="visibility: hidden;"></div>
        </header>

        <div class="page-container">
            
            <div class="page-title">
                <i class="fa-regular fa-bell" style="color: #adff00;"></i>
                Solicitações Pendentes
            </div>

            <div class="notification-card">
                <div class="notif-header">
                    <div class="notif-icon icon-user"><i class="fa-regular fa-user"></i></div>
                    <div class="notif-text">
                        <span class="notif-name">Carlos Eduardo</span>
                        <span class="notif-desc">Deseja ser seu aluno.</span>
                    </div>
                </div>
                <form class="action-buttons" method="POST" th:action="@{/personal/aceitarAluno}">
                    <button type="button" class="btn-reject">Recusar</button>
                    <button type="submit" class="btn-accept">Aceitar</button>
                </form>
            </div>

            <div class="notification-card">
                <div class="notif-header">
                    <div class="notif-icon icon-photo"><i class="fa-solid fa-camera"></i></div>
                    <div class="notif-text">
                        <span class="notif-name">Mateus Albuquerque</span>
                        <span class="notif-desc">Enviou novas fotos de progresso.</span>
                    </div>
                </div>
                <a href="./personal_avaliacao.html" th:href="@{/personal/avaliacao}" class="btn-full">
                    <i class="fa-solid fa-magnifying-glass"></i> Avaliar Agora
                </a>
            </div>

        </div>

    </main>
</body>
</html>
