<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymPulse - Entrar</title>
    <link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 24px;
            align-items: center;
        }

        .auth-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-top: 20px;
        }

        .auth-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .auth-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-box {
            width: 100%;
            height: 50px;
            background-color: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-sizing: border-box;
        }

        .input-box i {
            color: #adff00;
            font-size: 1.1rem;
        }

        .input-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 0.9rem;
        }

        .input-box input::placeholder {
            color: #666666;
        }

        .auth-footer {
            margin-top: 10px;
            text-align: center;
            font-size: 0.85rem;
            color: #aaaaaa;
        }

        .auth-link {
            color: #adff00;
            font-weight: 700;
            text-decoration: none;
        }

        .auth-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <main class="app-screen">
        
        <div class="auth-container">
            <!-- pesinho no topo -->
            <div class="auth-header">
                <i class="fa-solid fa-dumbbell" style="font-size: 3rem; color: #adff00;"></i>
                <h1 class="auth-title">GYMPULSE</h1>
            </div>

            <form action="home.html" th:action="@{/login}" method="POST" class="auth-form">
                
                <div class="input-box">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" name="email" placeholder="E-mail" required>
                </div>

                <!-- campo de senha -->
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" name="senha" placeholder="Senha" required>
                </div>

                <button type="submit" class="btn-primary" style="margin-top: 8px;">ENTRAR</button>
            </form>

            <div class="auth-footer">
                Não tem uma conta? 
                <a href="cadastro.html" th:href="@{/cadastro}" class="auth-link">Cadastre-se</a>
            </div>
        </div>

    </main>

</body>
</html>
