<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymPulse - Avaliar Aluno</title>
    <link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .page-container { width: 100%; display: flex; flex-direction: column; gap: 16px; }
        
        .week-selector {
            display: flex;
            justify-content: space-between;
            background-color: #1a1a1a;
            border-radius: 20px;
            padding: 8px 12px;
        }
        .day-btn { color: #ffffff; font-size: 0.8rem; font-weight: 700; padding: 6px 10px; border-radius: 12px; text-decoration: none; }
        .day-btn.active { background-color: #adff00; color: #000000; }

        .assessment-card {
            border: 1px solid #adff00;
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background-color: #121212;
            box-sizing: border-box;
        }
        
        .student-badge { display: flex; align-items: center; gap: 12px; color: #ffffff; font-weight: 800; font-size: 0.95rem; }
        .student-badge i { background: #2a2a2a; color: #888; padding: 10px; border-radius: 50%; border: 2px solid #adff00; }

        .tabs { display: flex; gap: 8px; width: 100%; }
        .tab-btn { flex: 1; height: 35px; background-color: #1a1a1a; color: #ffffff; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 700; border: none; cursor: pointer; }
        .tab-btn.active { color: #adff00; }

        .photo-box {
            width: 100%;
            aspect-ratio: 1;
            background-color: #777777;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #cccccc;
            font-size: 4rem;
        }

        .feedback-input {
            width: 100%;
            height: 50px;
            background-color: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 25px;
            padding: 0 20px;
            color: #ffffff;
            font-family: inherit;
            font-size: 0.9rem;
            box-sizing: border-box;
            outline: none;
        }
        .feedback-input:focus { border-color: #adff00; }
    </style>
</head>
<body>
    <main class="app-screen" style="justify-content: flex-start;">
        
        <header class="top-header" style="position: relative;">
            <div class="profile-avatar"><i class="fa-regular fa-user"></i></div>
            <div style="text-align: center; position: absolute; left: 50%; transform: translateX(-50%);">
                <i class="fa-solid fa-dumbbell" style="font-size: 1.5rem; color: #adff00;"></i>
                <div style="color: #adff00; font-size: 0.75rem; font-weight: 800; margin-top: 2px; text-transform: uppercase;">Personal</div>
                <div style="color: #ffffff; font-weight: 800; font-size: 0.9rem;">Luiz Felipe</div>
            </div>
            <a href="personal_home.html" class="icon-btn" style="text-decoration: none;"><i class="fa-solid fa-bars"></i></a>
        </header>

        <div class="page-container">
            <div class="week-selector">
                <a href="#" class="day-btn">Seg</a>
                <a href="#" class="day-btn">Ter</a>
                <a href="#" class="day-btn active">Qua</a>
                <a href="#" class="day-btn">Qui</a>
                <a href="#" class="day-btn">Sex</a>
                <a href="#" class="day-btn">Sáb</a>
                <a href="#" class="day-btn">Dom</a>
            </div>

            <div class="assessment-card">
                <div class="student-badge">
                    <i class="fa-solid fa-user"></i>
                    <span>Mateus Albuquerque</span>
                </div>

                <div class="tabs">
                    <button class="tab-btn active">Frente</button>
                    <button class="tab-btn">Lado</button>
                    <button class="tab-btn">Costas</button>
                </div>

                <div class="photo-box">
                    <i class="fa-solid fa-camera"></i>
                </div>
            </div>

            <form th:action="@{/personal/avaliacao/enviar}" method="POST" style="display: flex; flex-direction: column; gap: 12px; margin-top: 4px;">
                <input type="text" name="feedback" class="feedback-input" placeholder="Escrever avaliação..." required>
                <button type="submit" class="btn-primary">ENVIAR</button>
            </form>
        </div>

    </main>
</body>
</html>
