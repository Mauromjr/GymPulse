<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymPulse - Personal Home</title>
    <link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .page-container { width: 100%; display: flex; flex-direction: column; gap: 18px; }
        
        .search-box {
            width: 100%;
            height: 50px;
            background-color: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            box-sizing: border-box;
            gap: 12px;
        }
        .search-box input { flex: 1; background: transparent; border: none; color: #fff; outline: none; font-size: 0.95rem; }
        .search-box i { color: #adff00; font-size: 1.1rem; }

        .students-panel {
            width: 100%;
            border: 1px solid #adff00;
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-sizing: border-box;
        }
        .student-card {
            background-color: #121212;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .student-info { display: flex; align-items: center; gap: 12px; color: #ffffff; font-weight: 700; font-size: 0.95rem; }
        .student-info i { color: #adff00; font-size: 1.1rem; }
        .btn-add {
            background-color: #adff00;
            color: #000000;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 1rem;
            transition: 0.2s;
        }
        .btn-add:hover { background-color: #8ccf00; }
    </style>
</head>
<body>
    <main class="app-screen" style="justify-content: flex-start;">
        
        <header class="top-header" style="position: relative;">
            <div class="profile-avatar" style="text-decoration: none; color: inherit;">
                <i class="fa-regular fa-user"></i>
            </div>
            
            <div style="text-align: center; position: absolute; left: 50%; transform: translateX(-50%);">
                <i class="fa-solid fa-dumbbell" style="font-size: 1.5rem; color: #adff00;"></i>
                <div style="color: #adff00; font-size: 0.75rem; font-weight: 800; margin-top: 2px; text-transform: uppercase;">Personal</div>
                <div style="color: #ffffff; font-weight: 800; font-size: 0.9rem;" th:text="${personal != null ? personal.nome : 'Luiz Felipe'}">Luiz Felipe</div>
            </div>
            
            <a href="./personal_solicitacoes.html" th:href="@{/personal/solicitacoes}" class="icon-btn" style="text-decoration: none;">
                <i class="fa-regular fa-comments"></i>
                <span class="badge">2</span>
            </a>
        </header>

        <div class="page-container">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Buscar aluno...">
            </div>

            <div class="students-panel">
                <div class="student-card">
                    <div class="student-info">
                        <i class="fa-regular fa-user"></i>
                        <span>Mateus Albuquerque</span>
                    </div>
                    <a href="./personal_treino.html" th:href="@{/personal/treino}" class="btn-add"><i class="fa-solid fa-plus"></i></a>
                </div>

                <div class="student-card">
                    <div class="student-info">
                        <i class="fa-regular fa-user"></i>
                        <span>Aluno cadastrado #2</span>
                    </div>
                    <a href="./personal_treino.html" th:href="@{/personal/treino}" class="btn-add"><i class="fa-solid fa-plus"></i></a>
                </div>
            </div>
        </div>

    </main>
</body>
</html>
